<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Atlas — Document Library</title><meta name="description" content="An AI-maintained library of HTML and PDF documents."><style>:root{font-family:Inter,ui-sans-serif,system-ui,sans-serif;color:#182434;background:#f8fafc}*{box-sizing:border-box}body{margin:0}a{color:inherit}main{max-width:1100px;margin:0 auto;padding:48px 24px}header{display:flex;justify-content:space-between;align-items:center;gap:20px}.home{color:#607087;font-size:14px}.kicker{color:#4266b0;font-weight:700;letter-spacing:.12em;font-size:12px;text-transform:uppercase}h1{font-size:clamp(40px,7vw,72px);letter-spacing:-.06em;margin:12px 0 10px}.intro{color:#607087;font-size:18px;max-width:620px;line-height:1.6}.tools{display:flex;gap:12px;flex-wrap:wrap;margin:38px 0 20px}input,select{border:1px solid #cfd8e5;border-radius:10px;padding:14px 16px;font:inherit;background:white}input{flex:1;min-width:240px}.count{color:#607087;font-size:14px;margin:0 0 16px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:18px}.card{padding:24px;border-radius:16px;background:white;border:1px solid #e2e8f0;text-decoration:none;display:block;transition:transform .15s,border-color .15s;min-height:218px}.card:hover{transform:translateY(-3px);border-color:#7794d0}.card h2{font-size:22px;letter-spacing:-.025em;margin:18px 0 8px}.card p{color:#607087;line-height:1.6;font-size:14px}.tag{background:#ecf2ff;color:#385996;display:inline-block;border-radius:99px;padding:4px 10px;font-size:12px;margin-right:5px}.meta{display:flex;justify-content:space-between;gap:10px;color:#8190a4;font-size:12px;margin-top:22px}footer{color:#8190a4;border-top:1px solid #e2e8f0;margin-top:65px;padding-top:20px;font-size:13px}.empty{color:#607087;padding:40px 0}</style></head><body><main><header><span class="kicker">Atlas / Document hub</span><a class="home" href="../../">← Personal website</a></header><h1>Document Library<span style="color:#5576c1">.</span></h1><p class="intro">A growing collection of technical guides and research notes. Authored and maintained with AI; designed for human reading.</p><div class="tools"><input id="search" type="search" aria-label="Search documents" placeholder="Search documents, topics, descriptions…"><select id="topic" aria-label="Filter by topic"><option value="">All topics</option></select><select id="sort" aria-label="Sort documents"><option value="recent">Recently updated</option><option value="title">Title A–Z</option></select></div><p id="count" class="count" aria-live="polite"></p><section class="grid" id="grid" aria-label="Documents"></section><footer>Atlas · Static HTML/PDF publishing · <a href="catalog.json">Machine-readable catalog</a></footer></main><script>let docs=[];const grid=document.getElementById('grid'),count=document.getElementById('count'),search=document.getElementById('search'),topic=document.getElementById('topic'),sort=document.getElementById('sort');function render(){let q=search.value.toLowerCase().trim();let items=docs.filter(d=>(!topic.value||d.topics.includes(topic.value))&&[d.title,d.description,...d.topics].join(' ').toLowerCase().includes(q));items.sort((a,b)=>sort.value==='title'?a.title.localeCompare(b.title):b.updated.localeCompare(a.updated));grid.replaceChildren();count.textContent=items.length+' document'+(items.length===1?'':'s');for(let d of items){let card=document.createElement('a');card.className='card';card.href=d.href;const tags=document.createElement('div');for(let t of d.topics){let tag=document.createElement('span');tag.className='tag';tag.textContent=t;tags.append(tag)}let title=document.createElement('h2');title.textContent=d.title;let desc=document.createElement('p');desc.textContent=d.description;let meta=document.createElement('div');meta.className='meta';let updated=document.createElement('span');updated.textContent='Updated '+d.updated;let format=document.createElement('span');format.textContent=d.format.toUpperCase()+' ↗';meta.append(updated,format);card.append(tags,title,desc,meta);grid.append(card)}if(!items.length){let empty=document.createElement('p');empty.className='empty';empty.textContent='No documents match your search.';grid.append(empty)}}for(let el of [search,topic,sort])el.addEventListener(el===search?'input':'change',render);fetch('catalog.json').then(r=>{if(!r.ok)throw Error('Catalog request failed');return r.json()}).then(data=>{docs=data.documents;for(let t of [...new Set(docs.flatMap(d=>d.topics))].sort()){let opt=document.createElement('option');opt.value=t;opt.textContent=t;topic.append(opt)}render()}).catch(()=>{count.textContent='Unable to load the document catalog. Please refresh.'});</script></body></html>
